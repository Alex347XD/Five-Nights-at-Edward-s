<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="HandheldFriendly" content="true">
<title>Five Nights at Edward's</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />


<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style type="text/css">
  h1 { font-family: Arial, Helvetica, sans-serif; color: #F00; font-size: x-large; }
  p { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: small; }
  body { background-color: #FFF; text-align: center; margin: 0; padding: 0; }
  #bloctxt { border-left-width: 5px; border-left-style: solid; border-left-color: #F00; padding-left: 10px; position: absolute; left: 50%; width: 600px; margin-left: -260px }

  /* Buttons */
  .control-btn { position: absolute; bottom: 20px; padding: 12px 16px; font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; z-index: 9999; transition: opacity 0.4s ease; }
  #fullscreenBtn { right: 20px; background: rgba(176,0,0,0.85); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  #menuBtn { left: 20px; background: rgba(40,40,40,0.9); color: #fff; border: 1px solid #666; }
  .hidden-ui { opacity: 0; pointer-events: none; }
</style>

<!-- Clickteam HTML5 runtime -->
<script src="src/Runtime.js"></script>

<script>
if (!document.createElement("canvas").getContext) {
    window.open("http://www.clickteam.com/html5-fallback", "_self");
}

if (window.location.protocol == "file:") {
    document.write('<div id="bloctxt">');
    document.write('<h1>The application cannot be run...</h1>');
    document.write('<p>HTML browsers do not allow you to launch data files directly from the file system.<br>');
    document.write('Please use the Build & Run option (it opens a local web server) to run your application,<br>');
    document.write('or upload your application folder to a remote web-server, and start it from there...</p>');
    document.write('</div>');
    throw new Error("Cannot run application");
}
</script>
</head>
<body>

<!-- Wrapper for canvas + buttons -->
<div id="gameWrapper" style="display: inline-block; -webkit-user-select: none; text-align: left; position: relative;">
    <canvas id="MMFCanvas" width="1280" height="720">Your browser does not support Canvas.</canvas>

    <!-- Buttons inside wrapper -->
    <button id="menuBtn" class="control-btn" onclick="goToMenu()">⬅ Back to Menu</button>
    <button id="fullscreenBtn" class="control-btn" onclick="toggleFullscreen()">
        <i id="fullscreenIcon" class="bi bi-fullscreen"></i>
    </button>
</div>

<script>
window.addEventListener("load", windowLoaded, false);
function windowLoaded() {
    new Runtime("MMFCanvas", "resources/Five Nights at Edward's.cch");
}

// Buttons
const fullscreenBtn = document.getElementById("fullscreenBtn");
const fullscreenIcon = document.getElementById("fullscreenIcon");
const menuBtn = document.getElementById("menuBtn");

// Fullscreen toggle on wrapper
function toggleFullscreen() {
    const wrapper = document.getElementById("gameWrapper");

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
}

// Update icon dynamically
function updateFullscreenIcon() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        fullscreenIcon.classList.remove("bi-fullscreen");
        fullscreenIcon.classList.add("bi-fullscreen-exit");
    } else {
        fullscreenIcon.classList.remove("bi-fullscreen-exit");
        fullscreenIcon.classList.add("bi-fullscreen");
    }
}

// Listen for fullscreen changes
document.addEventListener("fullscreenchange", updateFullscreenIcon);
document.addEventListener("webkitfullscreenchange", updateFullscreenIcon);

// Go to menu
function goToMenu() {
    window.location.href = "index.html";
}

// Auto-hide UI buttons
const EDGE_ZONE = 100;

fullscreenBtn.classList.add("hidden-ui");
menuBtn.classList.add("hidden-ui");

function showUI() {
    fullscreenBtn.classList.remove("hidden-ui");
    menuBtn.classList.remove("hidden-ui");
}

function hideUI() {
    fullscreenBtn.classList.add("hidden-ui");
    menuBtn.classList.add("hidden-ui");
}

// Mouse movement for auto-show
document.addEventListener("mousemove", (e) => {
    const y = e.clientY;
    if (y <= EDGE_ZONE || y >= window.innerHeight - EDGE_ZONE) {
        showUI();
    } else {
        hideUI();
    }
});

// Touch auto-show
document.addEventListener("touchstart", () => {
    showUI();
    setTimeout(hideUI, 2000);
});
</script>

</body>
</html>
