<script>
window.addEventListener("load", windowLoaded, false);

function windowLoaded() {
    new Runtime("MMFCanvas", "resources/Five Nights at Edward's.cch");
}

// Buttons
const fullscreenBtn = document.getElementById("fullscreenBtn");
const menuBtn = document.getElementById("menuBtn");

// Fullscreen toggle with dynamic button text
function toggleFullscreen() {
    const canvas = document.getElementById("MMFCanvas");

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        // Enter fullscreen
        if (canvas.requestFullscreen) canvas.requestFullscreen();
        else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
        fullscreenBtn.textContent = "❎ Exit Fullscreen";
    } else {
        // Exit fullscreen
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        fullscreenBtn.textContent = "⛶ Full Screen";
    }
}

// Ensure button text updates if fullscreen changes outside button click
document.addEventListener("fullscreenchange", updateFullscreenText);
document.addEventListener("webkitfullscreenchange", updateFullscreenText);

function updateFullscreenText() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        fullscreenBtn.textContent = "❎ Exit Fullscreen";
    } else {
        fullscreenBtn.textContent = "⛶ Full Screen";
    }
}

// Go back to menu
function goToMenu() {
    window.location.href = "index.html";
}

// Auto-hide UI buttons
const EDGE_ZONE = 100;

fullscreenBtn.classList.add("hidden-ui");
menuBtn.classList.add("hidden-ui");

function showUI() {
    fullscreenBtn.classList.remove("hidden-ui");
    menuBtn.classList.remove("hidden-ui");
}

function hideUI() {
    fullscreenBtn.classList.add("hidden-ui");
    menuBtn.classList.add("hidden-ui");
}

document.addEventListener("mousemove", (e) => {
    const y = e.clientY;
    if (y <= EDGE_ZONE || y >= window.innerHeight - EDGE_ZONE) {
        showUI();
    } else {
        hideUI();
    }
});

document.addEventListener("touchstart", () => {
    showUI();
    setTimeout(hideUI, 2000);
});
</script>
