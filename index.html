<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Five Nights at Edward's</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    
    <!-- Optional: different sizes -->
    <link rel="icon" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #5b1b1b;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #ccc;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

	.about-button {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            z-index: 1000;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .about-button:hover {
            background: #b00000;
            transform: translateY(-1px);
        }

        a.button {
            display: block;
            padding: 14px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .play {
            background: #b00000;
            color: #fff;
        }

        .download {
            background: #222;
            color: #fff;
            border: 1px solid #555;
        }

        a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
        }

        footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <a href="about.html" class="about-button">About</a>
    <div class="container">
        <h1>Five Nights at Edward's</h1>
        <p>
            Welcome to <strong>Five Nights at Edward's</strong>.
            Download the latest version of the game.
        </p>

        <div class="buttons">
   	    <!-- Direct links from your site -->
            <a class="button play" href="play.html">▶ Play Now</a>

            <a class="button download" href="downloads/Five Nights at Edward's.exe" download>🖥️ Download for PC</a>
            <a class="button download" href="downloads/Five Nights at Edward's.apk" download>📱 Download for Android</a>
            <a class="button download" href="downloads/Five Nights at Edward's.ipa" download>🍎 Download for iOS</a>
	</div>

        <footer>
            © 2026 Edward's Province • Fan-made FNaF game
        </footer>
    </div>

    <script>
        function highlightPlatform() {
            const ua = navigator.userAgent;
            const isAndroid = /Android/i.test(ua);
            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const buttons = document.querySelectorAll('.button.download');

            buttons.forEach(btn => {
                if ((isAndroid && btn.textContent.includes('Android')) ||
                    (isIOS && btn.textContent.includes('iOS')) ||
                    (!isAndroid && !isIOS && btn.textContent.includes('PC'))) {
                    btn.style.border = '2px solid #b00000';
                    btn.style.boxShadow = '0 0 12px rgba(176, 0, 0, 0.8)';
                }
            });
        }

        highlightPlatform();
    </script>
</body>
</html>
