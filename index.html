<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Five Nights at Edward's</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a, #000);
            color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #5b1b1b;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #ccc;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top navigation buttons */

        .logs-button,
        .about-button,
        .guide-button {
            position: fixed;
            top: 15px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            z-index: 1000;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .logs-button {
            left: 15px;
        }

        .about-button {
            left: 75px;
        }

        .guide-button {
            left: 140px;
        }

        .logs-button:hover,
        .about-button:hover,
        .guide-button:hover {
            background: #b00000;
            transform: translateY(-1px);
        }

        /* Main buttons */

        a.button {
            display: block;
            padding: 14px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .play {
            background: #b00000;
            color: #fff;
        }

        .download {
            background: #222;
            color: #fff;
            border: 1px solid #555;
        }

        /* Version text under buttons */

        .versionText {
            display: block;
            font-size: 10px;
            color: #ccc;
            font-style: italic;
            margin-top: 2px;
            font-weight: normal;
        }

        a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
        }

        /* Device update warning */

        #updateWarning {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #ff4444;
            font-weight: bold;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.7);
            z-index: 1000;
        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <a href="logs.html" class="logs-button">Logs</a>
    <a href="about.html" class="about-button">About</a>
    <a href="guide.html" class="guide-button">Guide</a>


    <!-- Main container -->

    <div class="container">

        <h1>Five Nights at Edward's</h1>

        <p>
            Welcome to <strong>Five Nights at Edward's</strong>.
            Download or play the latest version of the game.
        </p>


        <!-- Buttons -->

        <div class="buttons">

            <!-- Web version -->

            <a class="button play" href="play.html">

                ▶ Play Now

                <span class="versionText" id="playVersion"></span>

            </a>


            <!-- Windows -->

            <a class="button download"
               href="downloads/Five Nights at Edward's.exe"
               download>

                🖥️ Download for Windows

                <span class="versionText" id="windowsVersionText"></span>

            </a>


            <!-- Android -->

            <a class="button download"
               href="downloads/Five Nights at Edward's.apk"
               download>

                📱 Download for Android

                <span class="versionText" id="androidVersionText"></span>

            </a>


            <!-- iOS -->

            <a class="button download"
               href="downloads/Five Nights at Edward's.ipa"
               download>

                🍎 Download for iOS

                <span class="versionText" id="iosVersionText"></span>

            </a>

        </div>

    </div>


    <!-- Update warning -->

    <div id="updateWarning" style="display: none;">

        THE GAME IS NOT YET UPDATED TO THE LATEST VERSION FOR YOUR DEVICE

    </div>


    <script>

        // ==========================================
        // VERSION NUMBERS
        // ==========================================

        // Main Windows version
        const windowsVersion = "0.5.2";

        // Web, Android, iOS, and other platforms
        const otherVersion = "0.5.1";


        // ==========================================
        // SHOW VERSION UNDER EACH BUTTON
        // ==========================================

        // Play.html always uses the web version
        document.getElementById("playVersion").textContent =
            `Version ${otherVersion}`;


        // Windows uses the main version
        document.getElementById("windowsVersionText").textContent =
            `Version ${windowsVersion}`;


        // Android uses the other version
        document.getElementById("androidVersionText").textContent =
            `Version ${otherVersion}`;


        // iOS uses the other version
        document.getElementById("iosVersionText").textContent =
            `Version ${otherVersion}`;


        // ==========================================
        // PLATFORM DETECTION
        // ==========================================

        const ua = navigator.userAgent;

        const isWindows = /Windows/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPhone|iPad|iPod/i.test(ua);


        // ==========================================
        // OUTDATED DEVICE WARNING
        // ==========================================

        const updateWarning =
            document.getElementById("updateWarning");


        // Show warning on Android, iOS, and all
        // other non-Windows platforms if behind.

        if (!isWindows && otherVersion !== windowsVersion) {

            updateWarning.style.display = "block";

        }


        // ==========================================
        // HIGHLIGHT CORRECT DOWNLOAD BUTTON
        // ==========================================

        function highlightPlatform() {

            const buttons =
                document.querySelectorAll('.button.download');


            buttons.forEach(btn => {

                if (

                    (isAndroid &&
                    btn.textContent.includes('Android'))

                    ||

                    (isIOS &&
                    btn.textContent.includes('iOS'))

                    ||

                    (!isAndroid &&
                    !isIOS &&
                    btn.textContent.includes('Windows'))

                ) {

                    btn.style.border =
                        '2px solid #b00000';

                    btn.style.boxShadow =
                        '0 0 12px rgba(176, 0, 0, 0.8)';

                }

            });

        }


        highlightPlatform();

    </script>

</body>

</html>
