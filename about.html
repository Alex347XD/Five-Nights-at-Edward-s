<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Edward's</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="icon" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />

<style>
/* ALERT OVERLAY */
.alert-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 0, 0, 0.15);
    pointer-events: none;
    opacity: 0;
    animation: overlayFlicker 0.6s linear;
}

@keyframes overlayFlicker {
    0% { opacity: 0; }
    20% { opacity: 0.4; }
    40% { opacity: 0.1; }
    60% { opacity: 0.35; }
    100% { opacity: 0; }
}

/* ALERT TEXT */
.alert {
    color: #ff2b2b;
    font-weight: bold;
    text-shadow: 0 0 6px red;
    animation: alertFlash 0.8s infinite;
}
@keyframes alertFlash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

body {
    margin: 0;
    background: #000;
    color: #cfcfcf;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.log-container {
    background: #050505;
    border: 2px solid #5b1b1b;
    padding: 30px;
    max-width: 900px;
    width: 95%;
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
    position: relative;
}

/* SCREEN SHAKE */
.shake { animation: shake 0.15s linear; }
@keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, 2px); }
    100% { transform: translate(0, 0); }
}

/* LOG TEXT */
.log {
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 0.95rem;
}

/* REDACTIONS */
.redacted {
    background: #8B0000;
    color: #8B0000;
    padding: 0 4px;
    border-radius: 2px;
    cursor: help;
    position: relative;
    font-weight: bold;
    box-shadow: 0 0 6px #FF0000;
    animation: pulseGlow 1.5s infinite alternate;
}
.redacted::after {
    content: "████████";
    color: #FF0000;
    text-shadow: 0 0 6px #FF0000, 0 0 12px #FF0000;
}
.redacted:hover {
    color: #fff;
    animation: glitch 0.35s infinite, pulseGlow 1.5s infinite alternate;
    text-shadow: 0 0 6px #FF0000, 0 0 12px #FF0000, 0 0 20px #FF4C4C;
}

@keyframes pulseGlow {
    0% { box-shadow: 0 0 6px #FF0000, 0 0 10px #FF0000; }
    50% { box-shadow: 0 0 12px #FF4C4C, 0 0 20px #FF4C4C; }
    100% { box-shadow: 0 0 6px #FF0000, 0 0 10px #FF0000; }
}

@keyframes glitch {
    0% { text-shadow: 2px 0 red; }
    20% { text-shadow: -2px 0 cyan; }
    40% { text-shadow: 2px 0 white; }
    60% { text-shadow: -1px 0 red; }
    100% { text-shadow: none; }
}

.corrupt {
    color: #ff3c3c;
    text-shadow: 0 0 6px red;
}

/* CURSOR */
.cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: #ff3c3c;
    margin-left: 4px;
    animation: blink 1s infinite;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

/* BACK & SKIP & NEXT BUTTONS */
.back, #nextNight {
    display: inline-block;
    margin-top: 25px;
    margin-right: 10px;
    padding: 8px 12px;
    border: 1px solid #555;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
}
.back:hover, #nextNight:hover { background: #5b1b1b; }

/* START OVERLAY */
#startOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ff3c3c;
    font-family: 'Courier New', monospace;
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 9999;
    text-align: center;
}

/* MUTE BUTTON */
#muteButton {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111;
    border: 1px solid #555;
    padding: 10px;
    color: #fff;
    cursor: pointer;
}
#muteButton:hover { background: #5b1b1b; }

/* POPUP SHAKE EFFECT */
.popup-shake {
    animation: popupShake 0.25s linear;
}
@keyframes popupShake {
    0% { transform: translateX(-50%) translateY(0); }
    25% { transform: translateX(-50%) translateY(-5px); }
    50% { transform: translateX(-50%) translateY(5px); }
    75% { transform: translateX(-50%) translateY(-5px); }
    100% { transform: translateX(-50%) translateY(0); }
}

/* POPUP LOADING BAR */
#loadingBarContainer {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 20px;
    background: #111;
    border: 2px solid #ff2b2b;
    display: none;
    z-index: 10001;
}

#loadingBar {
    width: 0%;
    height: 100%;
    background: #ff2b2b;
    transition: width 0.1s linear;
}

@keyframes resolvePulse {
    0% { box-shadow: 0 0 6px #0f0; }
    50% { box-shadow: 0 0 14px #0f0; }
    100% { box-shadow: 0 0 6px #0f0; }
}

#resolveBar {
    animation: resolvePulse 0.6s infinite alternate;
}
</style>
</head>
<body>

<div class="log-container" id="screen">
    <div class="alert-overlay" id="alertOverlay"></div>
    <div class="log" id="logText"></div>
    <a href="index.html" class="back">← RETURN TO MAIN MENU</a>
    <a href="#" class="back" id="skipButton">SKIP LOG →</a>
    <a id="nextNight" class="back" style="display:none;">NEXT NIGHT →</a>
</div>

<div id="startOverlay">CLICK TO START NIGHT SHIFT</div>
<button id="muteButton">Mute</button>

<!-- AUDIO -->
<audio id="typeSound" src="resources/type.mp3" preload="auto"></audio>
<audio id="glitchSound" src="resources/glitch.mp3" preload="auto"></audio>
<audio id="resolveSound" src="resources/resolve.mp3" preload="auto"></audio>

<!-- RED FLASH OVERLAY -->
<div id="flashOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.3s ease;
"></div>

<!-- ALERT POPUP -->
<div id="alertPopup" style="
    position: fixed; 
    top: -120px; 
    left: 50%; 
    transform: translateX(-50%);
    background: #111; 
    border: 2px solid #ff2b2b; 
    padding: 20px 30px; 
    color: #ff2b2b;
    font-family: 'Courier New', monospace; 
    font-size: 1.1rem; 
    text-align: center; 
    z-index: 10000;
    box-shadow: 0 0 20px red; 
    transition: top 0.5s ease;
">
    <span id="alertPopupText"></span>
    <div id="resolveBox" style="
        margin-top:12px; 
        padding:8px 12px; 
        border:1px solid #ff2b2b; 
        color:#fff; 
        background:#111; 
        cursor:pointer; 
        display:inline-block;
    "></div>
</div>

<!-- LOADING BAR -->
<div id="loadingBarContainer"><div id="loadingBar"></div></div>

<script>
// ---------------- CONFIG ----------------
let NIGHT = 1;
const maxNight = 5;
const baseSpeed = 120;
let speed = baseSpeed - NIGHT*5;
const BASE_ALERT_CHANCE = 0.0005;
const BASE_CORRUPTION_CHANCE = 0.05;
const ALERT_UNLOCK_INDEX = 50;
let muted = false;

const logContent = [
"", // index 0 unused
`Security Log 1 — Edward’s Theme Park
STATUS: ABANDONED
POWER GRID: PARTIALLY OFFLINE
ACCESS LEVEL: NIGHT SECURITY ONLY

------------------------------------------------------------

ASSIGNMENT BRIEF:
I have been assigned as the assigned overnight security guard of Edward’s Theme Park.

The park has been closed for <span class="redacted">██████████</span>.
No caretakers.
No official power source.

Cameras flicker despite corroded wiring.
Motion sensors trigger in areas where nothing should be moving.
Occasional shapes appear in the dark, vanishing when zoomed in.

THIS LOCATION IS NOT EMPTY.

------------------------------------------------------------
KNOWN ANIMATRONIC ENTITIES
------------------------------------------------------------

ENTITY: EDWARD THE DEVIL
The park’s original star. Moves relentlessly toward the office even if monitored.
Behavior is unpredictable; careful planning is essential.

ENTITY: NOMNOM THE DINO
Bright blue, permanently hungry, sensors glitchy and erratic.
Moves toward activity or sound, monitoring only gives slight warnings.

ENTITY: BIG THE BOULDER
Stone-themed animatronic from the mountain zone.
Appears only on cameras and drains office power. Ignoring him leaves you powerless.

ENTITY: SMILEY
Mischievous clown from the funhouse zone.
Never harms the player but jump-scares cameras, temporarily disabling feeds.

ENTITY: SHINY EDWARD
Unfinished bright blue-green variant.
Wanders unpredictably; must be lured with audio cues to prevent approach.

ENTITY: SOY SAUCE EDWARD
Promotional food-themed variant.
Appears silently in the office; wearing the mask keeps him passive.

ENTITY: BUSINESS EDWARD
Corporate-themed Edward variant with briefcase.
Requires a constant payment flow to remain passive; neglect triggers aggression.

END OF NIGHT 1 LOG
LOGGED BY: ALEX <span class="redacted">███████</span>`,

`Security Log 2 — Edward’s Theme Park
STATUS: ABANDONED
POWER GRID: UNSTABLE
ACCESS LEVEL: NIGHT SECURITY ONLY

------------------------------------------------------------

SHIFT UPDATE:
Second night on-site. Systems react in unexpected ways.

Camera feeds flicker and glitch.  
Motion detectors trigger even in previously quiet zones.  
Audio hums, machinery stutters, and shadows seem to move against logic.

DO NOT TRUST THAT NOTHING IS MOVING.

------------------------------------------------------------
ENTITY STATUS UPDATE
------------------------------------------------------------

ENTITY: EDWARD THE DEVIL
Relentless and unpredictable; monitoring slows him slightly but won’t stop his approach.

ENTITY: NOMNOM THE DINO
Moves toward any detected activity or sound; warnings are minimal.

ENTITY: BIG THE BOULDER
Appears on cameras, draining office power rapidly. Ignoring him risks full shutdown.

ENTITY: SMILEY
Jumpscares cameras, temporarily disabling feeds; more chaos can be dangerous if ignored.

ENTITY: SHINY EDWARD
Audio cues required to lure him away; ignoring him allows slow approach to office.

ENTITY: SOY SAUCE EDWARD
Will observe silently in office; mask required to prevent attack sequence.

ENTITY: BUSINESS EDWARD
Payment meter must remain active; neglect triggers aggressive movement toward the office.

------------------------------------------------------------
INCIDENT REPORT:
At <span class="redacted">██:██</span>, Camera 03 displayed a hallway not listed in the map.
A figure appeared briefly before vanishing.
Feed glitched immediately afterward.

------------------------------------------------------------
REMINDER:
Careful observation and resource management are key to surviving.
Do not react impulsively.

END OF NIGHT 2 LOG
LOGGED BY: ALEX <span class="redacted">███████</span>`,

`Security Log 3 — Edward’s Theme Park
STATUS: ABANDONED
POWER GRID: CRITICAL
ACCESS LEVEL: NIGHT SECURITY ONLY

------------------------------------------------------------

SHIFT REPORT:
Third night. Threats are escalating.

Cameras glitch frequently; multiple zones trigger false positives.
Sounds echo unnaturally through the empty park.
Entities move faster and unpredictably.

AVOID DIRECT CONTACT.

------------------------------------------------------------
ENTITY STATUS UPDATE
------------------------------------------------------------

ENTITY: EDWARD THE DEVIL
Moves toward the office regardless of monitoring; slows slightly with careful observation.

ENTITY: NOMNOM THE DINO
Erratic movement, drawn to sounds and activity; monitoring warnings minimal.

ENTITY: BIG THE BOULDER
Office power drains rapidly when active; careful camera monitoring required.

ENTITY: SMILEY
Feed disruptions now overlap multiple cameras; can create dangerous distraction windows.

ENTITY: SHINY EDWARD
Bright and visible, but ignoring audio cues leads to approach; timing essential.

ENTITY: SOY SAUCE EDWARD
Mask required; failure triggers silent attack sequence in office.

ENTITY: BUSINESS EDWARD
Payment meter irregular; keeping funds flowing is critical to prevent aggression.

------------------------------------------------------------
INCIDENT REPORT:
At <span class="redacted">██:██</span>, Camera 07 displayed a figure behind the station.
Feed immediately glitched, coinciding with a power surge.
Random distorted audio repeated <span class="redacted">██████████</span>.

------------------------------------------------------------
WARNING:
Night 3 marks critical escalation.
Entities actively anticipate operator patterns.
Do not attempt unsanctioned overrides.

END OF NIGHT 3 LOG
LOGGED BY: ALEX <span class="redacted">███████</span>`,

`Security Log 4 — Edward’s Theme Park
STATUS: ABANDONED
POWER GRID: CRITICALLY UNSTABLE
ACCESS LEVEL: NIGHT SECURITY ONLY

------------------------------------------------------------

SHIFT ALERT:
Fourth night. Systems increasingly autonomous.

Camera feeds distort, doors open and close independently.
Auditory anomalies intensify—voices echo across the control room, repeating <span class="redacted">██████████</span>.

AVOID VISUAL CONTACT WITH ENTITIES.

------------------------------------------------------------
ENTITY STATUS UPDATE
------------------------------------------------------------

ENTITY: EDWARD THE DEVIL
Relentless; now capable of appearing in multiple feeds simultaneously.
Direct observation slows but does not stop him.

ENTITY: NOMNOM THE DINO
Aggressive, erratic movement.
Responds to sound and motion; monitoring only gives minimal warning.

ENTITY: BIG THE BOULDER
Appears on cameras draining office power; ignoring him risks full blackout.

ENTITY: SMILEY
Multiple feed disruptions; jump-scare chaos increased.

ENTITY: SHINY EDWARD
Audio cues required to lure him; otherwise he slowly approaches office.

ENTITY: SOY SAUCE EDWARD
Mask required to prevent attacks; failure leads to immediate threat.

ENTITY: BUSINESS EDWARD
Payment meter self-updating; must maintain flow to prevent aggression.

------------------------------------------------------------
INCIDENT REPORT:
At <span class="redacted">██:██</span>, a figure entered the security office.
All feeds glitched; power surged in east wing.
Multiple anomalies recorded: <span class="redacted">████████</span>.

------------------------------------------------------------
WARNING:
Night 4 is critical.  
Entities anticipate operator actions; every choice matters.  

END OF NIGHT 4 LOG
LOGGED BY: ALEX <span class="redacted">███████</span>`,

`Security Log 5 — Edward’s Theme Park
STATUS: ABANDONED
POWER GRID: FAILURE IMMINENT
ACCESS LEVEL: NIGHT SECURITY ONLY

------------------------------------------------------------

FINAL SHIFT REPORT:
Fifth night. Systems collapsing entirely.

Camera feeds flicker violently; doors operate independently.
Auditory feedback is continuous: distorted voices repeating <span class="redacted">████████████</span>.
Backup generators offline.  

DO NOT MOVE.  
Do not leave the office.  
Do not react.

------------------------------------------------------------
ENTITY STATUS UPDATE
------------------------------------------------------------

ENTITY: EDWARD THE DEVIL
Behavior unpredictable; can appear anywhere in feeds.
Observation only slows him slightly.

ENTITY: NOMNOM THE DINO
Aggression unchecked; drawn to all activity and sound.

ENTITY: BIG THE BOULDER
Office power drains rapidly; ignoring him risks total blackout.

ENTITY: SMILEY
Feeds permanently disabled when active; jump-scare chaos escalated.

ENTITY: SHINY EDWARD
Approaches quickly if ignored; audio cues essential.

ENTITY: SOY SAUCE EDWARD
Mask required; failure triggers instant office attack.

ENTITY: BUSINESS EDWARD
Payment system fully corrupted; aggressive if funds lapse.

------------------------------------------------------------
INCIDENT REPORT:
At <span class="redacted">██:██</span>, feed displayed a hallway not on maps.
A figure gestured at the camera; feed glitched infinitely.
Attempts to regain control failed.

------------------------------------------------------------
WARNING:
Night 5 is terminal.
Entities beyond prediction; monitoring is advisory only.
Do not leave your post or react to anomalies.

END OF NIGHT LOG
LOGGED BY: ALEX <span class="redacted">███████</span>`
];

// ALERTS
const entityAlerts = [
    { text: "⚠ ENTITY MOVED: BIG THE BOULDER\nPOWER LEVEL DROPPING", resolve: "Stabilize Power", resolved: "Power Stabilized" },
    { text: "⚠ ENTITY MOVED: SMILEY\nCAMERA FEEDS TEMPORARILY DISABLED", resolve: "Restore Feeds", resolved: "Camera Feeds Restored" },
    { text: "⚠ ENTITY MOVED: SHINY EDWARD\nAUDIO LURE REQUIRED", resolve: "Reboot Audio Lure", resolved: "Audio Lure Online" },
    { text: "⚠ ENTITY MOVED: EDWARD THE DEVIL\nAPPROACHING OFFICE", resolve: "Close Left Door", resolved: "Left Door Closed" },
    { text: "⚠ ENTITY MOVED: NOMNOM THE DINO\nMOVEMENT DETECTED NEAR OFFICE", resolve: "Close Right Door", resolved: "Right Door Closed" },
    { text: "⚠ ENTITY MOVED: SOY SAUCE EDWARD\nMASK NOT DETECTED", resolve: "Wear Mask", resolved: "Mask On" },
    { text: "⚠ ENTITY MOVED: BUSINESS EDWARD\nPAYMENT METER LOW", resolve: "Pay Employee", resolved: "Employee Paid" }
];

const cameraAlerts = [
    { 
        text: "⚠ CAMERA 01 (HELL)\nFIRE EFFECTS FLICKERING\nSMOKE DETECTED IN CORRIDORS", 
        resolve: "Check Fire Suppression",
	resolved: "Fire Suppression Checked"
    },
    { 
        text: "⚠ CAMERA 02 (MOUNTAIN)\nROCK SLIDE TRIGGERED\nDEBRIS BLOCKING PATHS", 
        resolve: "Clear Mountain Debris",
	resolved: "Mountain Debris Cleared"
    },
    { 
        text: "⚠ CAMERA 03 (FOREST)\nTREES SWAY WITHOUT WIND\nUNIDENTIFIED MOVEMENTS IN UNDERBRUSH", 
        resolve: "Inspect Forest",
	resolved: "Forest Inspected"
    },
    { 
        text: "⚠ CAMERA 04 (DINOSAUR EXHIBIT)\nEXHIBIT LIGHTS FLICKERING\nANCIENT MACHINERY STIRRING", 
        resolve: "Reset Exhibit Systems",
	resolved: "Exghibit Systems Reset" 
    }
];
const corruptChars = ["#", "%", "@", "█", "?", "&"];

const target = document.getElementById("logText");
const overlay = document.getElementById("alertOverlay");
const typeSound = document.getElementById("typeSound");
const glitchSound = document.getElementById("glitchSound");
const startOverlay = document.getElementById("startOverlay");
const skipButton = document.getElementById("skipButton");
const nextNight = document.getElementById("nextNight");
const muteButton = document.getElementById("muteButton");

const popup = document.getElementById("alertPopup");
const popupText = document.getElementById("alertPopupText");
const resolveBox = document.getElementById("resolveBox");
const flashOverlay = document.getElementById("flashOverlay");

const loadingBarContainer = document.getElementById("loadingBarContainer");
const loadingBar = document.getElementById("loadingBar");

let index = 0;
let typingPaused = false;
let typing = false;

// ---------------- HELPERS ----------------
function random(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function triggerGlitch(){
    if(!muted){ 
        glitchSound.currentTime = 0;
        glitchSound.play().catch(()=>{});
    }
    document.getElementById("screen").classList.add("shake");
    overlay.style.animation = "none";
    overlay.offsetHeight;
    overlay.style.animation = "overlayFlicker 0.6s linear";
    setTimeout(()=>document.getElementById("screen").classList.remove("shake"), 150);
}

function playType(){
    if(!muted){
        const sound = typeSound.cloneNode();
        sound.volume = 0.5;
        sound.playbackRate = 0.9 + Math.random()*0.2;
        sound.play().catch(()=>{});
    }
}

// ---------------- ALERT + LOADING ----------------
let currentAlert = null;

function showAlert(alert){
    typingPaused = true;
    currentAlert = alert; // save for when button clicked

    popupText.innerText = alert.text;
    resolveBox.innerText = alert.resolve; // button text is alert.resolve
    resolveBox.style.display = "inline-block";
    resolveBox.style.color = "#fff";
    popup.style.top = "50px";
    flashOverlay.style.opacity = 0.3;

    // shake/glitch effect
    popup.classList.add("popup-shake");
    setTimeout(()=> popup.classList.remove("popup-shake"), 300);
}

// ---------------- TYPE LOOP ----------------
function splitHTMLString(str) {
    const result = [];
    let tag = false;
    let buffer = "";
    for (let char of str) {
        if (char === "<") tag = true;
        if (tag) buffer += char;
        else result.push(char);
        if (char === ">") {
            tag = false;
            result.push(buffer);
            buffer = "";
        }
    }
    return result;
}

let charArray = splitHTMLString(logContent[NIGHT]);

function typeLog() {
    if (typingPaused) { setTimeout(typeLog, 100); return; }
    const corruptionChance = BASE_CORRUPTION_CHANCE + NIGHT*0.01;
    const alertChance = BASE_ALERT_CHANCE * NIGHT;
    if (index < charArray.length) {
        let output = charArray.slice(0, index+1).join("");
        if (Math.random() < corruptionChance) {
            output += `<span class="corrupt">${random(corruptChars)}</span>`;
            triggerGlitch();
        }
        if(index > ALERT_UNLOCK_INDEX && Math.random() < alertChance){
            const alert = Math.random() < 0.2 ? random(cameraAlerts) : random(entityAlerts);
            showAlert(alert);
        }
        target.innerHTML = output + "<span class='cursor'></span>";
        playType();
        index++;
        setTimeout(typeLog, speed);
    } else {
        target.innerHTML = charArray.join("");
        typing = false;
        if (NIGHT < maxNight) nextNight.style.display = "inline-block";
    }
}

function startResolve(alert){
    const barContainer = document.createElement("div");
    barContainer.style.position = "fixed";
    barContainer.style.top = "50%";
    barContainer.style.left = "50%";
    barContainer.style.transform = "translate(-50%, -50%)";
    barContainer.style.width = "300px";
    barContainer.style.height = "12px";
    barContainer.style.border = "2px solid #ff2b2b";
    barContainer.style.background = "#111";
    barContainer.style.zIndex = 10001;
    document.body.appendChild(barContainer);

    const bar = document.createElement("div");
    bar.style.width = "0%";
    bar.style.height = "100%";
    bar.style.background = "#ff3c3c";
    barContainer.appendChild(bar);

    let progress = 0;

    function pulseAndFlicker() {
        const flicker = 0.5 + Math.random() * 0.5; // flicker effect
        bar.style.width = `${Math.min(progress * flicker, 100)}%`;
    }

    const interval = setInterval(() => {
        progress += Math.random() * 2; // speed fluctuates
        pulseAndFlicker();
        if(progress >= 100){
            clearInterval(interval);
            bar.style.width = "100%";
            bar.style.background = "#0f0"; // flash green

            if(!muted){
                const resolveSound = document.getElementById("resolveSound");
                resolveSound.currentTime = 0;
                resolveSound.play().catch(()=>{});
            }

            // reset everything so typing can continue
            setTimeout(() => {
                barContainer.remove();
                typingPaused = false;      // ← unpause typing
                popup.style.top = "-120px"; // hide popup
                flashOverlay.style.opacity = 0;
            }, 500);
        }
    }, 50 + Math.random() * 50); // random interval for flicker
}

// ---------------- BUTTONS ----------------
startOverlay.addEventListener("click", () => {
    startOverlay.style.display = "none";
    if(NIGHT < 1 || NIGHT > maxNight) NIGHT = 1;
    charArray = splitHTMLString(logContent[NIGHT]);
    typeLog();
});

skipButton.addEventListener("click",(e)=>{
    e.preventDefault();
    typingPaused = false;
    typing = false;
    index = logContent[NIGHT].length;
    target.innerHTML = logContent[NIGHT];
    if(NIGHT < maxNight) nextNight.style.display = "inline-block";
});

nextNight.addEventListener("click", (e) => {
    e.preventDefault();
    NIGHT++;
    index = 0;
    speed = baseSpeed - NIGHT * 5;
    target.innerHTML = "";
    nextNight.style.display = "none";
    charArray = splitHTMLString(logContent[NIGHT]);
    typeLog();
});

muteButton.addEventListener("click",()=>{
    muted = !muted;
    muteButton.innerText = muted ? "Unmute" : "Mute";
});

resolveBox.addEventListener("click", () => {
    if (!currentAlert) return;

    resolveBox.style.display = "none"; // hide button while bar runs
    startResolve(currentAlert); // start the progress bar
    currentAlert = null;
});


</script>
</body>
</html>
